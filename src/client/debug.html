<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumen debug</title>
    <link rel="stylesheet" type="text/css" href="debug.css" />
  </head>
  <body>
    <aside id="days"></aside>
    <main>
      <header>
        <button id="prev" aria-label="Previous day">‹</button>
        <h1 id="title"></h1>
        <button id="next" aria-label="Next day">›</button>
      </header>
      <p id="meta"></p>
      <div class="controls">
        <button id="show-solution">Show par solution</button>
        <button id="clear">Clear pieces</button>
        <span id="status"></span>
      </div>
      <div id="board"></div>
      <p class="hint">
        Developer tool, not the game. Click grass to cycle: mirror /, mirror \, prism, empty. Blue is
        water (light passes, no piece). Grey is rock and dark green is tree (both stop light).
      </p>
      <details>
        <summary>Difficulty model (for tuning)</summary>
        <table id="factors"></table>
      </details>
    </main>
    <script type="module" src="debug.ts"></script>
  </body>
</html>
